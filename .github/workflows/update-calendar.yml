name: Generate Abdel Calendar

on:
  schedule:
    - cron: '*/15 6-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abdel-calendar
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Generate ICS
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: python generate_calendar.py

      - name: Commit and push updated ICS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/abdel.ics

          if git diff --cached --quiet; then
            echo "No changes to calendar."
            exit 0
          fi

          git commit -m "Update Abdel calendar $(date -u +%Y-%m-%d)"

          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push rejected. Resetting to latest main and regenerating..."

            git fetch origin main
            git reset --hard origin/main

            python generate_calendar.py

            git add output/abdel.ics

            if git diff --cached --quiet; then
              echo "Calendar is already up to date."
              exit 0
            fi

            git commit -m "Update Abdel calendar $(date -u +%Y-%m-%d)"

            sleep $((RANDOM % 5 + 1))
          done

          echo "Failed to push after 5 attempts."
          exit 1
